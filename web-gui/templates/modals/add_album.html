<!-- Add Album Modal -->
<div id="add-album-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                <i class="fas fa-plus-circle text-green-600"></i>
                Add Album
            </h2>
            <button onclick="closeAddAlbumModal()" class="text-gray-500 hover:text-gray-700">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="space-y-4">
            <!-- Album Link Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-link"></i> Google Photos Album Link
                </label>
                <input type="text" id="album-link-input"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="https://photos.google.com/album/..."
                       oninput="onAlbumLinkInput()">
                <p class="text-xs text-gray-500 mt-1">
                    Paste the full URL of the Google Photos album
                </p>
            </div>

            <!-- Extracted Album ID (read-only) -->
            <div id="album-id-container" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-fingerprint"></i> Album ID (extracted automatically)
                </label>
                <input type="text" id="album-id-display" readonly
                       class="w-full px-3 py-2 border border-gray-200 rounded-md bg-gray-50 text-gray-600 font-mono text-sm">
            </div>

            <!-- Album Name Input -->
            <div id="album-name-container" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-tag"></i> Album Name (folder name)
                </label>
                <input type="text" id="album-name-input"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="e.g., Vacation 2024, Family Photos...">
                <p class="text-xs text-gray-500 mt-1">
                    This name will be used as the folder name for downloaded photos
                </p>
            </div>
        </div>

        <div class="flex gap-3 mt-6">
            <button id="add-album-btn" onclick="addAlbumToList()" disabled
                    class="flex-1 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
                <i class="fas fa-plus"></i> Add Album
            </button>
            <button onclick="closeAddAlbumModal()"
                    class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
                Cancel
            </button>
        </div>
    </div>
</div>
