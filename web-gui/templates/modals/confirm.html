<!-- Confirmation Modal -->
<div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <div class="mb-4">
            <h3 class="text-lg font-bold text-gray-800 mb-2" id="confirm-title"></h3>
            <p class="text-gray-600" id="confirm-message"></p>
        </div>
        <div class="flex gap-3">
            <button id="confirm-yes" class="flex-1 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                Confirm
            </button>
            <button id="confirm-no" class="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
                Cancel
            </button>
        </div>
    </div>
</div>
