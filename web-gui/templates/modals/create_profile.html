<!-- Create Profile Modal -->
<div id="create-profile-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                <i class="fas fa-user-plus text-green-600"></i>
                Create New Profile
            </h2>
            <button onclick="closeCreateProfileModal()" class="text-gray-500 hover:text-gray-700">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="mb-4">
            <label for="profile-name-input" class="block text-sm font-medium text-gray-700 mb-2">
                Profile Name
            </label>
            <input type="text" id="profile-name-input"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500"
                   placeholder="e.g., Family Photos, Work Account, etc."
                   maxlength="50">
        </div>
        <div class="bg-blue-50 border-l-4 border-blue-400 p-3 mb-4">
            <p class="text-sm text-blue-800">
                <i class="fas fa-info-circle"></i>
                After creating the profile, you'll need to authenticate it using the VNC interface.
            </p>
        </div>
        <div class="flex gap-3">
            <button onclick="createNewProfile()"
                    class="flex-1 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                <i class="fas fa-check"></i> Create Profile
            </button>
            <button onclick="closeCreateProfileModal()"
                    class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
                Cancel
            </button>
        </div>
    </div>
</div>
