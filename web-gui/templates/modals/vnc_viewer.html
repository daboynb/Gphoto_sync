<!-- VNC Viewer Modal -->
<div id="vnc-viewer-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-7xl mx-4 flex flex-col" style="max-height: 90vh;">
        <!-- Header -->
        <div class="flex justify-between items-center p-4 border-b">
            <h2 class="text-xl font-bold text-gray-800">
                <i class="fas fa-desktop text-blue-600"></i>
                VNC Viewer &mdash; <span id="vnc-viewer-profile-name"></span>
            </h2>
            <button onclick="closeVNCViewer()" class="text-gray-500 hover:text-gray-700">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <!-- VNC iframe -->
        <div class="flex-1 p-2" style="min-height: 0;">
            <iframe id="vnc-viewer-iframe"
                    class="w-full rounded border border-gray-300"
                    style="height: 75vh; pointer-events: none;"
                    src=""
                    frameborder="0">
            </iframe>
        </div>

        <!-- Footer -->
        <div class="flex justify-between items-center p-4 border-t">
            <p class="text-sm text-gray-500">
                <i class="fas fa-eye"></i> Read-only view &mdash; interaction is disabled
            </p>
            <div class="flex gap-2">
                <button onclick="openVNCInteractive()"
                        class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm">
                    <i class="fas fa-external-link-alt"></i> Open Interactive
                </button>
                <button onclick="closeVNCViewer()"
                        class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 text-sm">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
